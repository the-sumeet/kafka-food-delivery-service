services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    ports:
      - "9092:9092"   # for apps running on your laptop (host)
    environment:
      # KRaft mode: this one node is both broker and controller (no ZooKeeper)
      KAFKA_NODE_ID: 1 # A unique ID for this node in the cluster. We have one node, so it's 1.
      KAFKA_PROCESS_ROLES: broker,controller # The jobs this node does
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # The list of controller nodes, written as id@host:port. Here, node 1 at host kafka on port 9093.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # Which listener (defined below) is used for controller traffic.

      # Three listeners: controller (internal), INTERNAL (other containers), EXTERNAL (your laptop)
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # We create topics explicitly so partition counts are deliberate
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Single node: internal topics can only have 1 replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=kafka:29092
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server $$B --create --if-not-exists --topic order-events     --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic payment-events   --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic driver-locations --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic orders-dlq       --partitions 1 --replication-factor 1
        echo "Topics:"; $$T --bootstrap-server $$B --list

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
